<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP ROYAL DATA TEST</title>
<style>
body{background:#071018;color:white;font-family:Arial;padding:20px}
h2{color:#f5c542}
#status{font-size:22px;margin:20px 0}
#price{font-size:32px;color:#55e0a3}
#log{font-size:13px;color:#aaa;line-height:1.6}
</style>
</head>

<body>

<h2>OP ROYAL TRADE — DATA TEST</h2>

<div id="status">STARTING...</div>
<div id="price">WAITING</div>
<div id="log">Connecting...</div>

<script>

const url =
"https://icy-snow-263a.optrader06.workers.dev/api.twelvedata.com/time_series?symbol=XAU/USD&interval=15min&outputsize=5";

async function test(){

document.getElementById("status").innerText="FETCHING...";

try{

const response=await fetch(url,{cache:"no-store"});

document.getElementById("log").innerText=
"HTTP STATUS: "+response.status;

const data=await response.json();

console.log(data);

if(data.values && data.values.length){

const latest=data.values[0];

document.getElementById("status").innerText="DATA LIVE";
document.getElementById("status").style.color="#55e0a3";

document.getElementById("price").innerText=
"XAU/USD  "+latest.close;

document.getElementById("log").innerText=
"SUCCESS • Candles: "+data.values.length+
" • Time: "+latest.datetime;

}else{

document.getElementById("status").innerText="DATA ERROR";

document.getElementById("log").innerText=
JSON.stringify(data);

}

}catch(error){

document.getElementById("status").innerText="FETCH ERROR";

document.getElementById("log").innerText=
error.name+" : "+error.message;

}

}

test();

</script>

</body>
</html>
