<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OP ROYAL TEST</title>
<style>
body{
background:#0b0f14;
color:white;
font-family:Arial;
padding:20px;
}
button{
width:100%;
padding:15px;
font-size:18px;
font-weight:bold;
margin-top:15px;
}
pre{
white-space:pre-wrap;
word-break:break-word;
background:#111821;
padding:12px;
border-radius:10px;
margin-top:15px;
}
</style>
</head>

<body>

<h2>👑 OP ROYAL XAUUSD TEST</h2>

<div id="status">Testing Worker...</div>

<button onclick="testWorker()">
TEST LIVE DATA
</button>

<pre id="result">Waiting...</pre>

<script>

async function testWorker(){

const status=document.getElementById("status");
const result=document.getElementById("result");

status.innerText="Connecting...";
result.innerText="";

const url=
"https://icy-snow-263a.optrader06.workers.dev/api.twelvedata.com/time_series?symbol=XAU/USD&interval=15min&outputsize=5";

try{

const response=await fetch(
url,
{
method:"GET",
cache:"no-store"
}
);

result.innerText=
"HTTP STATUS: "+
response.status+
"\n\n";

const text=await response.text();

result.innerText+=text;

if(response.ok){

status.innerText=
"✅ WORKER CONNECTED";

}else{

status.innerText=
"❌ WORKER ERROR";

}

}catch(error){

status.innerText=
"❌ CONNECTION FAILED";

result.innerText=
error.toString();

}

}

testWorker();

</script>

</body>
</html>
